<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>First-run Setup — Automatixes</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px;">
<div class="card" style="max-width: 440px; width: 100%; padding: 32px;">
  <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 20px;">
    <div style="font-size: 28px;">🔐</div>
    <div>
      <h1 style="margin: 0; font-size: 22px; font-weight: 700;">First-run Setup</h1>
      <p class="muted" style="margin: 2px 0 0 0; font-size: 13px;">Create master admin account or connect with Google</p>
    </div>
  </div>

  <a href="/auth/google" class="btn-google" style="margin-bottom: 20px;">
    <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
    Sign up with Google
  </a>

  <div class="divider-or"><span>OR CREATE MASTER CREDENTIALS</span></div>

  <form method="post" action="/setup" class="form">
    <label>
      Admin Username
      <input type="text" name="username" value="admin" required autocomplete="username">
    </label>
    <label>
      Admin Password
      <input type="password" name="password" required autocomplete="new-password" minlength="8" placeholder="At least 8 characters">
    </label>
    <label>
      Confirm Password
      <input type="password" name="password2" required autocomplete="new-password" minlength="8" placeholder="Re-enter password">
    </label>
    <button class="btn primary" style="width: 100%; margin-top: 16px; padding: 12px; font-weight: 600;">
      Initialize Master Account →
    </button>
  </form>
</div>
</body>
</html>
