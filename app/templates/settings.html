{% extends "base.html" %}
{% block content %}
<h1>Settings</h1>
<form method="post" action="/settings" class="form">
<label>Server timezone <span class="tip" title="Sending windows are evaluated in this timezone unless a campaign sets its own.">?</span>
<select name="timezone" required>
{% for tz in timezones %}<option value="{{ tz }}" {% if s.timezone==tz %}selected{% endif %}>{{ tz }}</option>{% endfor %}
</select></label>
<label>Public base URL <span class="tip" title="Used to build the one-click unsubscribe link in every email. Must be reachable by recipients.">?</span>
<input type="text" name="base_url" value="{{ s.base_url }}" required></label>
<label>Default physical mailing address <span class="tip" title="Anti-spam laws require a physical address in marketing emails. Shown in every email footer.">?</span>
<input type="text" name="physical_address" value="{{ s.physical_address }}" placeholder="e.g. Street, City, Pakistan"></label>
<label>Reply check interval (minutes) <span class="tip" title="How often inboxes are polled for replies. Enter a single number (5) or a jitter range (5-8) — a random interval in the range is used each time, which looks more human.">?</span>
<input type="text" name="reply_poll_minutes" value="{{ s.reply_poll_minutes }}" placeholder="5 or 5-8" pattern="\d{1,3}(-\d{1,3})?"></label>
<button class="btn primary">Save settings</button>
</form>
{% endblock %}
